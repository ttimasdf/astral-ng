<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090d12">
    <meta name="robots" content="index, follow">
    <meta
      name="description"
      content="Enmesh-NG 是一款基于 EasyTier 构建的开源跨平台 P2P 组网与 VPN 应用。"
    >
    <title>Enmesh-NG — 你的网络，随处相连。</title>
    <link rel="icon" type="image/png" href="/enmesh-mark.png">
    <style>
      :root {
        color-scheme: dark;
        --ink: #090d12;
        --panel: #101820;
        --line: rgba(229, 240, 246, 0.13);
        --muted: #91a0ac;
        --paper: #edf5f7;
        --cyan: #18c8e7;
        --lime: #8dea55;
        --orange: #ff922f;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--ink);
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        color: var(--paper);
        background:
          radial-gradient(circle at 77% 48%, rgba(24, 200, 231, 0.09), transparent 29rem),
          radial-gradient(circle at 4% 100%, rgba(141, 234, 85, 0.055), transparent 24rem),
          var(--ink);
        font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        content: "";
        opacity: 0.42;
        background-image:
          linear-gradient(var(--line) 1px, transparent 1px),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: 72px 72px;
        mask-image: linear-gradient(to bottom, black, transparent 86%);
      }

      .page {
        width: min(1180px, calc(100% - 48px));
        min-height: 100vh;
        margin: 0 auto;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-color: var(--line);
        border-style: solid;
      }

      header {
        padding: 24px 0;
        border-width: 0 0 1px;
      }

      .brand,
      .status,
      .actions,
      footer {
        gap: 12px;
      }

      .brand,
      .status {
        display: flex;
        align-items: center;
      }

      .brand img {
        width: 34px;
        height: 34px;
      }

      .brand-name {
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, serif;
        font-size: 1.2rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .brand-meta,
      .status,
      .eyebrow,
      footer {
        color: var(--muted);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 0.7rem;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .brand-meta::before {
        margin-right: 10px;
        color: #394650;
        content: "/";
      }

      .language {
        margin-left: 18px;
        color: var(--muted);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 0.7rem;
        letter-spacing: 0.13em;
        text-decoration: none;
        text-transform: uppercase;
        transition: color 180ms ease;
      }

      .language:hover,
      .language:focus-visible {
        color: var(--paper);
      }

      .language:focus-visible {
        outline: 2px solid var(--lime);
        outline-offset: 4px;
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--lime);
        box-shadow: 0 0 16px rgba(141, 234, 85, 0.8);
        animation: pulse 2.6s ease-in-out infinite;
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(320px, 0.85fr);
        gap: 7vw;
        align-items: center;
        padding: 70px 0 82px;
      }

      .copy {
        animation: rise 700ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
      }

      .eyebrow {
        margin: 0 0 22px;
        color: var(--cyan);
      }

      h1 {
        max-width: 780px;
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, serif;
        font-size: clamp(3.8rem, 8vw, 7.5rem);
        font-weight: 500;
        line-height: 0.86;
        letter-spacing: -0.07em;
      }

      h1 em {
        display: inline-block;
        color: transparent;
        background: linear-gradient(100deg, var(--cyan), var(--lime) 58%, var(--orange));
        background-clip: text;
        font-weight: 500;
      }

      .lede {
        max-width: 590px;
        margin: 34px 0 0;
        color: #b6c2ca;
        font-size: clamp(1rem, 1.5vw, 1.18rem);
        line-height: 1.75;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        margin-top: 36px;
      }

      .button {
        min-height: 48px;
        padding: 0 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--line);
        color: var(--paper);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 0.76rem;
        letter-spacing: 0.08em;
        text-decoration: none;
        text-transform: uppercase;
        transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
      }

      .button.primary {
        border-color: var(--paper);
        color: var(--ink);
        background: var(--paper);
      }

      .button:hover {
        border-color: var(--cyan);
        background: rgba(24, 200, 231, 0.08);
        transform: translateY(-2px);
      }

      .button.primary:hover {
        color: var(--paper);
      }

      .button:focus-visible {
        outline: 2px solid var(--lime);
        outline-offset: 4px;
      }

      .visual {
        position: relative;
        min-height: 420px;
        display: grid;
        place-items: center;
        animation: rise 700ms 140ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
      }

      .orbit {
        position: absolute;
        width: min(38vw, 430px);
        aspect-ratio: 1;
        border: 1px solid var(--line);
        border-radius: 50%;
        animation: turn 28s linear infinite;
      }

      .orbit::before,
      .orbit::after {
        position: absolute;
        width: 9px;
        height: 9px;
        border: 4px solid var(--ink);
        border-radius: 50%;
        content: "";
      }

      .orbit::before {
        top: 14%;
        right: 9%;
        background: var(--cyan);
        box-shadow: 0 0 22px rgba(24, 200, 231, 0.75);
      }

      .orbit::after {
        bottom: 3%;
        left: 27%;
        background: var(--lime);
        box-shadow: 0 0 22px rgba(141, 234, 85, 0.65);
      }

      .orbit.secondary {
        width: min(31vw, 350px);
        border-style: dashed;
        opacity: 0.55;
        animation-direction: reverse;
        animation-duration: 36s;
      }

      .mark {
        width: min(27vw, 285px);
        filter: drop-shadow(0 28px 55px rgba(0, 0, 0, 0.48));
        animation: float 6s ease-in-out infinite;
      }

      .coordinate {
        position: absolute;
        right: 0;
        bottom: 4%;
        color: #52616c;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 0.64rem;
        letter-spacing: 0.14em;
        writing-mode: vertical-rl;
      }

      footer {
        padding: 22px 0 26px;
        border-width: 1px 0 0;
      }

      footer span:nth-child(2) {
        color: #c1ccd2;
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes pulse {
        50% { opacity: 0.42; transform: scale(0.82); }
      }

      @keyframes turn {
        to { transform: rotate(360deg); }
      }

      @keyframes float {
        50% { transform: translateY(-10px) rotate(1deg); }
      }

      html[lang="zh-CN"] body {
        font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      html[lang="zh-CN"] h1 {
        line-height: 1.08;
        letter-spacing: -0.045em;
      }

      html[lang="zh-CN"] .lede {
        line-height: 2.05;
        letter-spacing: 0.02em;
      }

      @media (max-width: 820px) {
        .page {
          width: min(100% - 32px, 640px);
        }

        .brand-meta,
        .coordinate {
          display: none;
        }

        main {
          grid-template-columns: 1fr;
          gap: 18px;
          padding: 58px 0 48px;
        }

        h1 {
          font-size: clamp(3.6rem, 17vw, 6rem);
        }

        .visual {
          min-height: 330px;
          order: -1;
        }

        .orbit {
          width: 320px;
        }

        .orbit.secondary {
          width: 255px;
        }

        .mark {
          width: 210px;
        }

        footer {
          align-items: flex-start;
          flex-direction: column;
        }
      }

      @media (max-width: 460px) {
        .status-label,
        footer span:nth-child(2) {
          display: none;
        }

        .visual {
          min-height: 270px;
        }

        .orbit {
          width: 260px;
        }

        .orbit.secondary {
          width: 210px;
        }

        .mark {
          width: 170px;
        }

        .button {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <div class="brand">
          <img src="/enmesh-mark.png" alt="">
          <span class="brand-name">Enmesh-NG</span>
          <span class="brand-meta">P2P 组网</span>
        </div>
        <div class="status" aria-label="网络就绪">
          <span class="status-dot"></span>
          <span class="status-label">网络就绪</span>
          <a class="language" href="/" lang="en">EN</a>
        </div>
      </header>

      <main>
        <section class="copy">
          <p class="eyebrow">开源 · 跨平台</p>
          <h1>你的网络，<br><em>随处相连。</em></h1>
          <p class="lede">
            Enmesh-NG 让远程设备如同近在身边——一款基于 EasyTier、面向
            Windows、Linux 与 Android 的 P2P 组网与 VPN 客户端。
          </p>
          <div class="actions">
            <a class="button primary" href="https://github.com/ttimasdf/enmesh">
              查看 GitHub
            </a>
          </div>
        </section>

        <div class="visual" aria-hidden="true">
          <div class="orbit"></div>
          <div class="orbit secondary"></div>
          <img class="mark" src="/enmesh-mark.png" alt="">
          <span class="coordinate">组网 / 直连 / 安全</span>
        </div>
      </main>

      <footer>
        <span>基于 EasyTier</span>
        <span>Windows · Linux · Android</span>
        <span>GPL-3.0</span>
      </footer>
    </div>
  </body>
</html>
