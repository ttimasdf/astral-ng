name: Build Android

description: Build Android snapshot or signed release artifacts.

inputs:
  signed:
    description: Build signed production APKs.
    required: false
    default: 'false'
  upload-snapshot:
    description: Upload the unsigned debug snapshot APK.
    required: false
    default: 'false'
  keystore-base64:
    description: Base64-encoded Android upload keystore.
    required: false
    default: ''
  key-alias:
    description: Android upload key alias.
    required: false
    default: ''
  store-password:
    description: Android keystore password.
    required: false
    default: ''
  key-password:
    description: Android key password.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve build version
      id: resolve-version
      run: |
        python3 scripts/version.py sync --check
        python3 scripts/version.py resolve
        python3 scripts/version.py resolve --format output >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Setup pinned toolchains
      uses: ./.github/actions/setup-toolchains
      with:
        setup-android: 'true'

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "rust -> target"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libc6-dev
        sudo apt-get install -y libc6-dev-armhf-cross gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
        sudo apt-get install -y clang llvm libclang-dev
        sudo apt-get install -y libc-dev
        sudo apt-get install -y libc6-dev-i386 gcc-multilib g++-multilib
        sudo apt-get install -y protobuf-compiler
      shell: bash

    - name: Get dependencies
      run: flutter pub get
      shell: bash

    - name: Build snapshot APK
      if: inputs.signed != 'true'
      env:
        BUILD_CHANNEL: ${{ steps.resolve-version.outputs.build_channel }}
      run: |
        flutter build apk --debug \
          --target-platform android-arm64,android-arm \
          --build-name "${{ steps.resolve-version.outputs.flutter_build_name }}" \
          --build-number "${{ steps.resolve-version.outputs.flutter_build_number }}" \
          --dart-define "BUILD_CHANNEL=${{ steps.resolve-version.outputs.build_channel }}" \
          --dart-define "BUILD_COMMIT=${{ steps.resolve-version.outputs.build_commit }}" \
          --dart-define "BUILD_RUN_NUMBER=${{ steps.resolve-version.outputs.build_run_number }}" \
          --dart-define "UPDATE_API_BASE_URL=$UPDATE_API_BASE_URL"
        mv build/app/outputs/flutter-apk/app-debug.apk \
          "build/app/outputs/flutter-apk/${{ steps.resolve-version.outputs.app_executable }}-android-debug-${{ steps.resolve-version.outputs.asset_version }}.apk"
      shell: bash

    - name: Upload snapshot APK
      if: inputs['upload-snapshot'] == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.resolve-version.outputs.app_executable }}-android-debug-${{ steps.resolve-version.outputs.asset_version }}.apk
        path: build/app/outputs/flutter-apk/${{ steps.resolve-version.outputs.app_executable }}-android-debug-${{ steps.resolve-version.outputs.asset_version }}.apk
        archive: false
        if-no-files-found: error
        retention-days: ${{ fromJSON(steps.resolve-version.outputs.artifact_retention_days) }}

    - name: Setup Android release signing
      if: inputs.signed == 'true'
      run: |
        echo "${{ inputs['keystore-base64'] }}" | base64 --decode > android/app/upload-keystore.jks
        {
          echo "storeFile=upload-keystore.jks"
          echo "keyAlias=${{ inputs['key-alias'] }}"
          echo "storePassword=${{ inputs['store-password'] }}"
          echo "keyPassword=${{ inputs['key-password'] }}"
        } >> android/key.properties
      shell: bash

    - name: Build signed release APKs
      if: inputs.signed == 'true'
      env:
        BUILD_CHANNEL: ${{ steps.resolve-version.outputs.build_channel }}
      run: |
        flutter build apk --release \
          --target-platform android-arm64,android-arm \
          --split-per-abi \
          --build-name "${{ steps.resolve-version.outputs.flutter_build_name }}" \
          --build-number "${{ steps.resolve-version.outputs.flutter_build_number }}" \
          --dart-define "BUILD_CHANNEL=${{ steps.resolve-version.outputs.build_channel }}" \
          --dart-define "BUILD_COMMIT=${{ steps.resolve-version.outputs.build_commit }}" \
          --dart-define "BUILD_RUN_NUMBER=${{ steps.resolve-version.outputs.build_run_number }}" \
          --dart-define "UPDATE_API_BASE_URL=$UPDATE_API_BASE_URL"
        mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
          "build/app/outputs/flutter-apk/${{ steps.resolve-version.outputs.app_executable }}-android-arm64-${{ steps.resolve-version.outputs.asset_version }}.apk"
        mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
          "build/app/outputs/flutter-apk/${{ steps.resolve-version.outputs.app_executable }}-android-armv7-${{ steps.resolve-version.outputs.asset_version }}.apk"

        flutter build apk --release \
          --target-platform android-arm64,android-arm \
          --build-name "${{ steps.resolve-version.outputs.flutter_build_name }}" \
          --build-number "${{ steps.resolve-version.outputs.flutter_build_number }}" \
          --dart-define "BUILD_CHANNEL=${{ steps.resolve-version.outputs.build_channel }}" \
          --dart-define "BUILD_COMMIT=${{ steps.resolve-version.outputs.build_commit }}" \
          --dart-define "BUILD_RUN_NUMBER=${{ steps.resolve-version.outputs.build_run_number }}" \
          --dart-define "UPDATE_API_BASE_URL=$UPDATE_API_BASE_URL"
        mv build/app/outputs/flutter-apk/app-release.apk \
          "build/app/outputs/flutter-apk/${{ steps.resolve-version.outputs.app_executable }}-android-universal-${{ steps.resolve-version.outputs.asset_version }}.apk"
      shell: bash

    - name: Upload arm64 release APK
      if: inputs.signed == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.resolve-version.outputs.app_executable }}-android-arm64-${{ steps.resolve-version.outputs.asset_version }}.apk
        path: build/app/outputs/flutter-apk/${{ steps.resolve-version.outputs.app_executable }}-android-arm64-${{ steps.resolve-version.outputs.asset_version }}.apk
        archive: false
        if-no-files-found: error
        retention-days: ${{ fromJSON(steps.resolve-version.outputs.artifact_retention_days) }}

    - name: Upload armv7 release APK
      if: inputs.signed == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.resolve-version.outputs.app_executable }}-android-armv7-${{ steps.resolve-version.outputs.asset_version }}.apk
        path: build/app/outputs/flutter-apk/${{ steps.resolve-version.outputs.app_executable }}-android-armv7-${{ steps.resolve-version.outputs.asset_version }}.apk
        archive: false
        if-no-files-found: error
        retention-days: ${{ fromJSON(steps.resolve-version.outputs.artifact_retention_days) }}

    - name: Upload universal release APK
      if: inputs.signed == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.resolve-version.outputs.app_executable }}-android-universal-${{ steps.resolve-version.outputs.asset_version }}.apk
        path: build/app/outputs/flutter-apk/${{ steps.resolve-version.outputs.app_executable }}-android-universal-${{ steps.resolve-version.outputs.asset_version }}.apk
        archive: false
        if-no-files-found: error
        retention-days: ${{ fromJSON(steps.resolve-version.outputs.artifact_retention_days) }}
