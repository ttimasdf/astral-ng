name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

jobs:
  linux:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Resolve build version
        run: |
          python3 scripts/version.py sync --check
          python3 scripts/version.py resolve
          python3 scripts/version.py resolve --format env >> "$GITHUB_ENV"

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
          cache-sdk: true
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build libgtk-3-dev clang cmake pkg-config \
            libcurl4-openssl-dev protobuf-compiler libayatana-appindicator3-dev

      - name: Enable Linux desktop
        run: |
          flutter config --enable-linux-desktop
          flutter create --platforms=linux .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze application code
        run: flutter analyze lib

      - name: Build Linux
        run: flutter build linux --release --build-name "$FLUTTER_BUILD_NAME" --build-number "$FLUTTER_BUILD_NUMBER"

      - name: Install Linux packaging dependencies
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'pull_request' &&
           contains(github.event.pull_request.labels.*.name, 'full-ci'))
        run: |
          sudo apt-get install -y patchelf ruby-dev
          sudo gem install --no-document fpm

      - name: Package
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'pull_request' &&
           contains(github.event.pull_request.labels.*.name, 'full-ci'))
        run: |
          set -e
          mkdir -p release
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            ARTIFACT_PREFIX="astral-pr-${{ github.event.pull_request.number }}-unsigned"
          else
            ARTIFACT_PREFIX="astral"
          fi

          BUNDLE="$GITHUB_WORKSPACE/build/linux/x64/release/bundle"
          pushd "$BUNDLE"
          patchelf astral --add-needed libisar.so --add-needed librust_lib_astral.so
          tar -czf "$GITHUB_WORKSPACE/release/$ARTIFACT_PREFIX-linux-x64.tar.gz" ./*
          popd

          STAGING="$GITHUB_WORKSPACE/build/linux/pkgroot"
          rm -rf "$STAGING"
          mkdir -p "$STAGING/opt/astral"
          cp -a "$BUNDLE/." "$STAGING/opt/astral/"
          install -Dm755 linux/packaging/astral-cli.sh "$STAGING/usr/bin/astral"
          install -Dm644 linux/packaging/astral.desktop "$STAGING/usr/share/applications/astral.desktop"
          install -Dm644 assets/logo.png "$STAGING/usr/share/pixmaps/astral.png"

          fpm -s dir -t deb -n astral -v 1.0.0 -a amd64 -C "$STAGING" .
          mv -- ./*.deb "$GITHUB_WORKSPACE/release/$ARTIFACT_PREFIX-linux-x64.deb"

          fpm -s dir -t rpm -n astral -v 1.0.0 -a x86_64 -C "$STAGING" .
          mv -- ./*.rpm "$GITHUB_WORKSPACE/release/$ARTIFACT_PREFIX-linux-x64.rpm"

      - name: Upload artifacts
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: astral-linux-x64
          path: release/*
          retention-days: 30

      - name: Upload unsigned full-CI artifacts
        if: >-
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'full-ci')
        uses: actions/upload-artifact@v4
        with:
          name: astral-pr-${{ github.event.pull_request.number }}-unsigned-linux-x64
          path: |
            release/astral-pr-${{ github.event.pull_request.number }}-unsigned-linux-x64.tar.gz
            release/astral-pr-${{ github.event.pull_request.number }}-unsigned-linux-x64.deb
            release/astral-pr-${{ github.event.pull_request.number }}-unsigned-linux-x64.rpm
          if-no-files-found: error
          retention-days: 7

  windows:
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci') &&
      (github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Resolve build version
        run: |
          python scripts/version.py sync --check
          python scripts/version.py resolve
          python scripts/version.py resolve --format env >> $env:GITHUB_ENV

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
          cache-sdk: true
          cache: true

      - name: Install Inno Setup
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'pull_request' &&
           contains(github.event.pull_request.labels.*.name, 'full-ci'))
        run: choco install innosetup -y

      - name: Install Protobuf compiler
        run: |
          choco install protoc -y
          protoc --version
        shell: pwsh

      - name: Install Npcap SDK
        run: |
          # The upstream host is unreliable; use this immutable Wayback Machine capture.
          $sdkUrl = "https://web.archive.org/web/20260706070319id_/https://npcap.com/dist/npcap-sdk-1.16.zip"
          $sdkSha256 = "f0a8be7778ee3ae1b99bbbecb27a3ff0f6c111a4093f1c78c5c5a099607184db"
          $zip = Join-Path $env:RUNNER_TEMP "npcap-sdk.zip"
          $dst = Join-Path $env:GITHUB_WORKSPACE "third_party/npcap-sdk"
          Invoke-WebRequest -Uri $sdkUrl -OutFile $zip
          $actualSha256 = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($actualSha256 -ine $sdkSha256) {
            throw "Npcap SDK checksum mismatch: expected $sdkSha256, got $actualSha256"
          }
          if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
          New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dst -Force

          $libDir = Join-Path $dst "Lib\x64"
          if (!(Test-Path $libDir)) { throw "Npcap SDK lib dir not found: $libDir" }
          if (!(Test-Path (Join-Path $libDir "Packet.lib"))) { throw "Packet.lib not found in: $libDir" }
          if (!(Test-Path (Join-Path $libDir "wpcap.lib"))) { throw "wpcap.lib not found in: $libDir" }

          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $append = {
            param([string]$Line)
            [System.IO.File]::AppendAllText($env:GITHUB_ENV, "$Line`n", $utf8NoBom)
          }
          & $append "LIB=$libDir;$env:LIB"
          & $append "NPCAP_SDK_LIB=$libDir"
          Write-Host "Npcap SDK lib configured at $libDir"
        shell: pwsh

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release --build-name "$env:FLUTTER_BUILD_NAME" --build-number "$env:FLUTTER_BUILD_NUMBER"

      - name: Copy DLLs
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'pull_request' &&
           contains(github.event.pull_request.labels.*.name, 'full-ci'))
        run: |
          Copy-Item -Path "$env:GITHUB_WORKSPACE\dlls\*" -Destination "build\windows\x64\runner\Release\" -Recurse -Force

      - name: Package zip
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'pull_request' &&
           contains(github.event.pull_request.labels.*.name, 'full-ci'))
        run: |
          New-Item -ItemType Directory -Path "release" -Force
          if ("${{ github.event_name }}" -eq "pull_request") {
            $artifactPrefix = "astral-pr-${{ github.event.pull_request.number }}-unsigned"
          } else {
            $artifactPrefix = "astral"
          }
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "release\$artifactPrefix-windows-x64.zip" -Force

      - name: Upload zip artifact
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: astral-windows-x64-zip
          path: release/astral-windows-x64.zip
          retention-days: 30

      - name: Create Inno Setup script
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'pull_request' &&
           contains(github.event.pull_request.labels.*.name, 'full-ci'))
        run: |
          $version = (Select-String -Path "pubspec.yaml" -Pattern "version: (.*)").Matches[0].Groups[1].Value
          @"
          #define MyAppName "Astral-ng"
          #define MyAppVersion "$version"
          #define MyAppPublisher "KnownRabbit"
          #define MyAppURL "https://github.com/ttimasdf/astral-ng"
          #define MyAppExeName "astral.exe"

          [Setup]
          AppId={{9A41EC10-FBE6-4B63-8B18-A466907374B5}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          AppPublisherURL={#MyAppURL}
          AppSupportURL={#MyAppURL}
          AppUpdatesURL={#MyAppURL}
          DefaultDirName={autopf}\{#MyAppName}
          UninstallDisplayIcon={app}\{#MyAppExeName}
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          ChangesAssociations=yes
          DisableProgramGroupPage=yes
          OutputBaseFilename=astral-windows-x64-setup
          SolidCompression=yes
          WizardStyle=modern

          [Languages]
          Name: "chinese"; MessagesFile: "D:\ChineseSimplified.isl"

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"

          [Files]
          Source: "build\windows\x64\runner\Release\{#MyAppExeName}"; DestDir: "{app}"; Flags: ignoreversion
          Source: "build\windows\x64\runner\Release\*.dll"; DestDir: "{app}"; Flags: ignoreversion
          Source: "build\windows\x64\runner\Release\data\*"; DestDir: "{app}\data"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon
          "@ | Out-File -FilePath "setup.iss" -Encoding utf8

          curl.exe -fL -o D:\ChineseSimplified.isl https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl

      - name: Build installer
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
          (github.event_name == 'pull_request' &&
           contains(github.event.pull_request.labels.*.name, 'full-ci'))
        run: |
          New-Item -ItemType Directory -Path "release" -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
          if ("${{ github.event_name }}" -eq "pull_request") {
            $installerName = "astral-pr-${{ github.event.pull_request.number }}-unsigned-windows-x64-setup.exe"
          } else {
            $installerName = "astral-windows-x64-setup.exe"
          }
          Move-Item -Path "Output\astral-windows-x64-setup.exe" -Destination "release\$installerName" -Force

      - name: Upload setup artifact
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: astral-windows-x64-setup
          path: release/astral-windows-x64-setup.exe
          retention-days: 30

      - name: Upload unsigned full-CI artifacts
        if: >-
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'full-ci')
        uses: actions/upload-artifact@v4
        with:
          name: astral-pr-${{ github.event.pull_request.number }}-unsigned-windows-x64
          path: |
            release/astral-pr-${{ github.event.pull_request.number }}-unsigned-windows-x64.zip
            release/astral-pr-${{ github.event.pull_request.number }}-unsigned-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 7

  android:
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci') &&
      (github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-24.04
    env:
      JDK_VERSION: 17
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Resolve build version
        run: |
          python3 scripts/version.py sync --check
          python3 scripts/version.py resolve
          python3 scripts/version.py resolve --format env >> "$GITHUB_ENV"

      - name: Setup Rust
        run: rustup toolchain install stable --profile minimal

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
          cache-sdk: true
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '28.2.13676358'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libc6-dev
          sudo apt-get install -y libc6-dev-armhf-cross gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          sudo apt-get install -y clang llvm libclang-dev
          sudo apt-get install -y libc-dev
          sudo apt-get install -y libc6-dev-i386 gcc-multilib g++-multilib
          sudo apt-get install -y protobuf-compiler

      - name: Setup Rust targets
        run: |
          rustup target add armv7-linux-androideabi
          rustup target add aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Get dependencies
        run: flutter pub get

      - name: Validate Android build
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        run: flutter build apk --debug --target-platform android-arm64,android-arm --build-name "$FLUTTER_BUILD_NAME" --build-number "$FLUTTER_BUILD_NUMBER"

      - name: Prepare unsigned full-CI artifact
        if: >-
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'full-ci')
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-debug.apk \
            "release/astral-pr-${{ github.event.pull_request.number }}-debug-android.apk"

      - name: Upload unsigned full-CI artifact
        if: >-
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'full-ci')
        uses: actions/upload-artifact@v4
        with:
          name: astral-pr-${{ github.event.pull_request.number }}-debug-android
          path: release/astral-pr-${{ github.event.pull_request.number }}-debug-android.apk
          if-no-files-found: error
          retention-days: 7

      - name: Setup signing
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/key.properties

      - name: Build split APKs
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          flutter build apk --release --target-platform android-arm64,android-arm --split-per-abi --build-name "$FLUTTER_BUILD_NAME" --build-number "$FLUTTER_BUILD_NUMBER"
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "build/app/outputs/flutter-apk/astral-$ASSET_VERSION-android-arm64.apk"
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "build/app/outputs/flutter-apk/astral-$ASSET_VERSION-android-armv7.apk"

      - name: Upload split APK artifacts
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: astral-android-split
          path: |
            build/app/outputs/flutter-apk/astral-*-android-arm64.apk
            build/app/outputs/flutter-apk/astral-*-android-armv7.apk
          retention-days: 30

      - name: Build universal APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          flutter build apk --release --target-platform android-arm64,android-arm --build-name "$FLUTTER_BUILD_NAME" --build-number "$FLUTTER_BUILD_NUMBER"
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/astral-$ASSET_VERSION-android-universal.apk"

      - name: Upload universal APK artifact
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: astral-android-universal
          path: build/app/outputs/flutter-apk/astral-*-android-universal.apk
          retention-days: 30

  create-release:
    needs: [linux, windows, android]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve production version
        run: |
          python3 scripts/version.py sync --check
          python3 scripts/version.py resolve --channel production
          python3 scripts/version.py resolve --channel production --format env >> "$GITHUB_ENV"

      - name: Extract changelog for version
        id: extract-changelog
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "ERROR: CHANGELOG.md not found"
            exit 1
          fi
          CHANGELOG=$(awk -v ver="v$VERSION_BASE" '
            /^## / { in_section = 0 }
            $0 ~ "^## " ver { in_section = 1; next }
            in_section { print }
          ' CHANGELOG.md | sed '/^$/d')
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate changelog entry is present
        env:
          CHANGELOG: ${{ steps.extract-changelog.outputs.changelog }}
        run: |
          if [ -z "$CHANGELOG" ]; then
            echo "ERROR: No changelog entry found for $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -laR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.extract-changelog.outputs.changelog }}
          draft: false
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
