name: Deploy Update API

on:
  workflow_call:
    inputs:
      github_environment:
        description: Protected GitHub environment and matching Vercel environment
        required: true
        type: string
      checkout_ref:
        description: Immutable commit or tag to deploy
        required: true
        type: string
      public_base_url:
        description: Optional public API base URL to verify after deployment
        required: false
        default: ''
        type: string
    outputs:
      deployment-url:
        description: Immutable Vercel deployment URL
        value: ${{ jobs.deploy.outputs.deployment-url }}
      base-url:
        description: Immutable deployment API base URL
        value: ${{ jobs.deploy.outputs.base-url }}
  workflow_dispatch:

concurrency:
  group: >-
    update-api-${{ inputs.github_environment || 'Production' }}-${{
      (inputs.github_environment || 'Production') == 'Preview' && github.ref || 'shared' }}
  cancel-in-progress: ${{ (inputs.github_environment || 'Production') == 'Preview' }}

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.github_environment || 'Production' }}
      url: >-
        ${{ inputs.github_environment == 'Preview' && steps.deploy.outputs.deployment-url ||
            'https://enmesh.rabit.pw/' }}
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
      base-url: ${{ steps.deploy.outputs.base-url }}
    env:
      CHECKOUT_REF: ${{ inputs.checkout_ref || github.sha }}
      PUBLIC_BASE_URL: >-
        ${{ inputs.public_base_url ||
            (github.event_name == 'workflow_dispatch' &&
             'https://enmesh.rabit.pw/api/v1' || '') }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout deployment source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Deploy update API
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?Set VERCEL_TOKEN in the selected GitHub environment}"
          : "${VERCEL_ORG_ID:?Set VERCEL_ORG_ID in the selected GitHub environment}"
          : "${VERCEL_PROJECT_ID:?Set VERCEL_PROJECT_ID in the selected GitHub environment}"

          github_environment="${{ inputs.github_environment || 'Production' }}"
          case "$github_environment" in
            Preview)
              vercel_args=()
              ;;
            Production)
              vercel_args=(--prod)
              ;;
            *)
              echo "ERROR: github_environment must be Preview or Production"
              exit 1
              ;;
          esac

          umask 077
          mkdir -p .vercel
          project_response="$RUNNER_TEMP/vercel-project.json"
          environment_response="$RUNNER_TEMP/vercel-${github_environment,,}-environment.json"
          deployment_response="$RUNNER_TEMP/vercel-${github_environment,,}-deployment.json"
          verification_response="$RUNNER_TEMP/update-api-${github_environment,,}.json"

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --output "$project_response" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID"
          jq -e \
            --arg project_id "$VERCEL_PROJECT_ID" \
            --arg org_id "$VERCEL_ORG_ID" \
            '.id == $project_id and .accountId == $org_id and
             (.rootDirectory == "update-server" or .rootDirectory == "update-server/")' \
            "$project_response" >/dev/null
          jq '{
                projectId: .id,
                orgId: .accountId,
                projectName: .name,
                settings: {
                  createdAt: .createdAt,
                  framework: null,
                  devCommand: .devCommand,
                  installCommand: .installCommand,
                  buildCommand: .buildCommand,
                  outputDirectory: .outputDirectory,
                  rootDirectory: .rootDirectory,
                  directoryListing: .directoryListing,
                  nodeVersion: .nodeVersion
                }
              }' "$project_response" > .vercel/project.json

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --output "$environment_response" \
            "https://api.vercel.com/v3/env/pull/$VERCEL_PROJECT_ID/${github_environment,,}?source=github-actions&teamId=$VERCEL_ORG_ID"
          jq -e \
            '(.env | type == "object") and
             (.buildEnv | type == "object") and
             ((.env + .buildEnv) | to_entries |
              all(.key | test("^[A-Za-z_][A-Za-z0-9_]*$")))' \
            "$environment_response" >/dev/null
          jq -r \
            '(.env + .buildEnv) | to_entries[] |
             "\(.key)=\(.value | @json)"' \
            "$environment_response" > ".vercel/.env.${github_environment,,}.local"

          bunx vercel@59.1.3 build \
            "${vercel_args[@]}" \
            --token "$VERCEL_TOKEN"
          bunx vercel@59.1.3 deploy \
            --prebuilt \
            "${vercel_args[@]}" \
            --json \
            --token "$VERCEL_TOKEN" \
            > "$deployment_response"
          deployment_url="$(jq -er \
            '(.deployment.url? // .url?) |
             select(type == "string") |
             select(test("^https://[A-Za-z0-9-]+\\.vercel\\.app$"))' \
            "$deployment_response")"
          base_url="${deployment_url%/}/api/v1"

          verify_api() {
            local url="$1"
            local label="$2"
            local status
            status="$(curl --silent --show-error \
              --output "$verification_response" \
              --write-out '%{http_code}' \
              "${url%/}/versions?channel=stable&limit=1")"
            if [ "$status" != 200 ]; then
              echo "ERROR: $label returned HTTP $status"
              exit 1
            fi
            jq -e '.schemaVersion == 1 and (.data | type == "array")' \
              "$verification_response" >/dev/null
          }

          verify_api "$base_url" "Vercel deployment"
          if [ -n "$PUBLIC_BASE_URL" ]; then
            verify_api "$PUBLIC_BASE_URL" "Public production API"
          fi

          echo "deployment-url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "base-url=$base_url" >> "$GITHUB_OUTPUT"

      - name: Remove Vercel build state
        if: always()
        shell: bash
        run: |
          rm -rf -- .vercel
          rm -f -- \
            "$RUNNER_TEMP/vercel-project.json" \
            "$RUNNER_TEMP/vercel-preview-environment.json" \
            "$RUNNER_TEMP/vercel-preview-deployment.json" \
            "$RUNNER_TEMP/update-api-preview.json" \
            "$RUNNER_TEMP/vercel-production-environment.json" \
            "$RUNNER_TEMP/vercel-production-deployment.json" \
            "$RUNNER_TEMP/update-api-production.json"
