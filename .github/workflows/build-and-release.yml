name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

env:
  # Optional repository/environment override for the compiled update API base URL.
  UPDATE_API_BASE_URL: ${{ vars.UPDATE_API_BASE_URL || 'https://update.astral-ng.rabit.pw/api/v1' }}

jobs:
  linux:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Resolve build version
        id: resolve-version
        run: |
          python3 scripts/version.py sync --check
          python3 test/scripts/version_test.py
          python3 scripts/version.py resolve
          python3 scripts/version.py resolve --format output >> "$GITHUB_OUTPUT"

      - name: Setup pinned toolchains
        uses: ./.github/actions/setup-toolchains

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build libgtk-3-dev clang cmake pkg-config \
            libcurl4-openssl-dev protobuf-compiler libayatana-appindicator3-dev

      - name: Enable Linux desktop
        run: |
          flutter config --enable-linux-desktop
          flutter create --platforms=linux .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze application code
        run: flutter analyze lib

      - name: Build Linux
        env:
          BUILD_CHANNEL: ${{ steps.resolve-version.outputs.build_channel }}
        run: >-
          flutter build linux --release
          --build-name "${{ steps.resolve-version.outputs.flutter_build_name }}"
          --build-number "${{ steps.resolve-version.outputs.flutter_build_number }}"
          --dart-define "BUILD_CHANNEL=${{ steps.resolve-version.outputs.build_channel }}"
          --dart-define "BUILD_COMMIT=${{ steps.resolve-version.outputs.build_commit }}"
          --dart-define "BUILD_RUN_NUMBER=${{ steps.resolve-version.outputs.build_run_number }}"
          --dart-define "UPDATE_API_BASE_URL=$UPDATE_API_BASE_URL"

      - name: Install Linux packaging dependencies
        if: >-
          (github.event_name == 'push' &&
           (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
          (github.event_name == 'pull_request' &&
           contains(github.event.pull_request.labels.*.name, 'full-ci'))
        run: |
          sudo apt-get install -y patchelf ruby-dev
          sudo gem install --no-document fpm

      - name: Package
        if: >-
          (github.event_name == 'push' &&
           (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
          (github.event_name == 'pull_request' &&
           contains(github.event.pull_request.labels.*.name, 'full-ci'))
        env:
          BUILD_CHANNEL: ${{ steps.resolve-version.outputs.build_channel }}
          APP_EXECUTABLE: ${{ steps.resolve-version.outputs.app_executable }}
          APP_DISPLAY_NAME: ${{ steps.resolve-version.outputs.app_display_name }}
          ASSET_VERSION: ${{ steps.resolve-version.outputs.asset_version }}
          LINUX_PACKAGE_NAME: ${{ steps.resolve-version.outputs.linux_package_name }}
          PACKAGE_VERSION: ${{ steps.resolve-version.outputs.package_version }}
        run: |
          set -e
          mkdir -p release

          BUNDLE="$GITHUB_WORKSPACE/build/linux/x64/release/bundle"
          pushd "$BUNDLE"
          if [ "$APP_EXECUTABLE" != astral ]; then
            mv -- astral "$APP_EXECUTABLE"
          fi
          patchelf "$APP_EXECUTABLE" --add-needed libisar.so --add-needed librust_lib_astral.so
          tar -czf "$GITHUB_WORKSPACE/release/$APP_EXECUTABLE-linux-x64-$ASSET_VERSION.tar.gz" ./*
          popd

          STAGING="$GITHUB_WORKSPACE/build/linux/pkgroot"
          rm -rf "$STAGING"
          mkdir -p "$STAGING/opt/$APP_EXECUTABLE"
          cp -a "$BUNDLE/." "$STAGING/opt/$APP_EXECUTABLE/"

          install -d -m755 "$STAGING/usr/bin" "$STAGING/usr/share/applications"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            "# Launch $APP_DISPLAY_NAME from the installed bundle" \
            "exec /opt/$APP_EXECUTABLE/$APP_EXECUTABLE \"\$@\"" \
            > "$STAGING/usr/bin/$APP_EXECUTABLE"
          chmod 755 "$STAGING/usr/bin/$APP_EXECUTABLE"
          {
            printf '[Desktop Entry]\n'
            printf 'Name=%s\n' "$APP_DISPLAY_NAME"
            printf 'Comment=%s desktop client\n' "$APP_DISPLAY_NAME"
            printf 'Exec=/usr/bin/%s %%u\n' "$APP_EXECUTABLE"
            printf 'TryExec=/usr/bin/%s\n' "$APP_EXECUTABLE"
            printf 'Icon=%s\n' "$APP_EXECUTABLE"
            printf 'Terminal=false\nType=Application\nCategories=Network;\n'
            printf 'StartupNotify=true\nX-GNOME-UsesNotifications=true\n'
            printf 'Keywords=VPN;Network;Proxy;\n'
          } > "$STAGING/usr/share/applications/$APP_EXECUTABLE.desktop"

          if [ "$BUILD_CHANNEL" = canary ]; then
            ICON_SOURCE=assets/logo_canary.png
          else
            ICON_SOURCE=assets/logo.png
          fi
          install -Dm644 "$ICON_SOURCE" "$STAGING/usr/share/pixmaps/$APP_EXECUTABLE.png"

          fpm -s dir -t deb -n "$LINUX_PACKAGE_NAME" -v "$PACKAGE_VERSION" -a amd64 -C "$STAGING" .
          mv -- ./*.deb "$GITHUB_WORKSPACE/release/$APP_EXECUTABLE-linux-x64-$ASSET_VERSION.deb"

          fpm -s dir -t rpm -n "$LINUX_PACKAGE_NAME" -v "$PACKAGE_VERSION" -a x86_64 -C "$STAGING" .
          mv -- ./*.rpm "$GITHUB_WORKSPACE/release/$APP_EXECUTABLE-linux-x64-$ASSET_VERSION.rpm"

      - name: Upload Linux tarball
        if: >-
          (github.event_name == 'push' &&
           (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
          (github.event_name == 'pull_request' &&
           contains(github.event.pull_request.labels.*.name, 'full-ci'))
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.resolve-version.outputs.app_executable }}-linux-x64-${{ steps.resolve-version.outputs.asset_version }}.tar.gz
          path: release/${{ steps.resolve-version.outputs.app_executable }}-linux-x64-${{ steps.resolve-version.outputs.asset_version }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: ${{ fromJSON(steps.resolve-version.outputs.artifact_retention_days) }}

      - name: Upload Linux DEB
        if: >-
          (github.event_name == 'push' &&
           (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
          (github.event_name == 'pull_request' &&
           contains(github.event.pull_request.labels.*.name, 'full-ci'))
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.resolve-version.outputs.app_executable }}-linux-x64-${{ steps.resolve-version.outputs.asset_version }}.deb
          path: release/${{ steps.resolve-version.outputs.app_executable }}-linux-x64-${{ steps.resolve-version.outputs.asset_version }}.deb
          archive: false
          if-no-files-found: error
          retention-days: ${{ fromJSON(steps.resolve-version.outputs.artifact_retention_days) }}

      - name: Upload Linux RPM
        if: >-
          (github.event_name == 'push' &&
           (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
          (github.event_name == 'pull_request' &&
           contains(github.event.pull_request.labels.*.name, 'full-ci'))
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.resolve-version.outputs.app_executable }}-linux-x64-${{ steps.resolve-version.outputs.asset_version }}.rpm
          path: release/${{ steps.resolve-version.outputs.app_executable }}-linux-x64-${{ steps.resolve-version.outputs.asset_version }}.rpm
          archive: false
          if-no-files-found: error
          retention-days: ${{ fromJSON(steps.resolve-version.outputs.artifact_retention_days) }}

  windows:
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci') &&
      (github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Resolve build version
        id: resolve-version
        run: |
          python scripts/version.py sync --check
          python scripts/version.py resolve
          python scripts/version.py resolve --format output >> $env:GITHUB_OUTPUT

      - name: Setup pinned toolchains
        uses: ./.github/actions/setup-toolchains

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Install Protobuf compiler
        shell: pwsh
        run: |
          $attempts = 3
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            choco install protoc -y --no-progress
            if ($LASTEXITCODE -eq 0) {
              protoc --version
              exit $LASTEXITCODE
            }
            if ($attempt -lt $attempts) {
              Write-Warning "Chocolatey protoc install failed (attempt $attempt/$attempts); retrying in 30 seconds."
              Start-Sleep -Seconds 30
            }
          }
          throw "Unable to install protoc from Chocolatey after $attempts attempts."

      - name: Install Npcap SDK
        run: |
          # The upstream host is unreliable; use this immutable Wayback Machine capture.
          $sdkUrl = "https://web.archive.org/web/20260706070319id_/https://npcap.com/dist/npcap-sdk-1.16.zip"
          $sdkSha256 = "f0a8be7778ee3ae1b99bbbecb27a3ff0f6c111a4093f1c78c5c5a099607184db"
          $zip = Join-Path $env:RUNNER_TEMP "npcap-sdk.zip"
          $dst = Join-Path $env:GITHUB_WORKSPACE "third_party/npcap-sdk"
          Invoke-WebRequest -Uri $sdkUrl -OutFile $zip
          $actualSha256 = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($actualSha256 -ine $sdkSha256) {
            throw "Npcap SDK checksum mismatch: expected $sdkSha256, got $actualSha256"
          }
          if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
          New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dst -Force

          $libDir = Join-Path $dst "Lib\x64"
          if (!(Test-Path $libDir)) { throw "Npcap SDK lib dir not found: $libDir" }
          if (!(Test-Path (Join-Path $libDir "Packet.lib"))) { throw "Packet.lib not found in: $libDir" }
          if (!(Test-Path (Join-Path $libDir "wpcap.lib"))) { throw "wpcap.lib not found in: $libDir" }

          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          $append = {
            param([string]$Line)
            [System.IO.File]::AppendAllText($env:GITHUB_ENV, "$Line`n", $utf8NoBom)
          }
          & $append "LIB=$libDir;$env:LIB"
          & $append "NPCAP_SDK_LIB=$libDir"
          Write-Host "Npcap SDK lib configured at $libDir"
        shell: pwsh

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        env:
          BUILD_CHANNEL: ${{ steps.resolve-version.outputs.build_channel }}
        run: >-
          flutter build windows --release
          --build-name "${{ steps.resolve-version.outputs.flutter_build_name }}"
          --build-number "${{ steps.resolve-version.outputs.flutter_build_number }}"
          --dart-define "BUILD_CHANNEL=${{ steps.resolve-version.outputs.build_channel }}"
          --dart-define "BUILD_COMMIT=${{ steps.resolve-version.outputs.build_commit }}"
          --dart-define "BUILD_RUN_NUMBER=${{ steps.resolve-version.outputs.build_run_number }}"
          --dart-define "UPDATE_API_BASE_URL=$env:UPDATE_API_BASE_URL"

      - name: Rename packaged canary executable
        if: steps.resolve-version.outputs.app_executable != 'astral'
        run: |
          Rename-Item -Path "build\windows\x64\runner\Release\astral.exe" -NewName "${{ steps.resolve-version.outputs.app_executable }}.exe"

      - name: Copy DLLs
        run: |
          Copy-Item -Path "$env:GITHUB_WORKSPACE\dlls\*" -Destination "build\windows\x64\runner\Release\" -Recurse -Force

      - name: Package zip
        run: |
          New-Item -ItemType Directory -Path "release" -Force
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "release\${{ steps.resolve-version.outputs.app_executable }}-windows-x64-${{ steps.resolve-version.outputs.asset_version }}.zip" -Force

      - name: Create Inno Setup script
        env:
          SEMANTIC_VERSION: ${{ steps.resolve-version.outputs.semantic_version }}
          APP_DISPLAY_NAME: ${{ steps.resolve-version.outputs.app_display_name }}
          APP_EXECUTABLE: ${{ steps.resolve-version.outputs.app_executable }}
          WINDOWS_APP_ID: ${{ steps.resolve-version.outputs.windows_app_id }}
        run: |
          $version = $env:SEMANTIC_VERSION
          @"
          #define MyAppName "$env:APP_DISPLAY_NAME"
          #define MyAppVersion "$version"
          #define MyAppPublisher "KnownRabbit"
          #define MyAppURL "https://github.com/ttimasdf/astral-ng"
          #define MyAppExeName "$($env:APP_EXECUTABLE).exe"

          [Setup]
          AppId={$($env:WINDOWS_APP_ID)
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          AppPublisherURL={#MyAppURL}
          AppSupportURL={#MyAppURL}
          AppUpdatesURL={#MyAppURL}
          DefaultDirName={autopf}\{#MyAppName}
          UninstallDisplayIcon={app}\{#MyAppExeName}
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          ChangesAssociations=yes
          DisableProgramGroupPage=yes
          OutputBaseFilename=$($env:APP_EXECUTABLE)-windows-x64-setup
          SolidCompression=yes
          WizardStyle=modern

          [Languages]
          Name: "chinese"; MessagesFile: "D:\ChineseSimplified.isl"

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"

          [Files]
          Source: "build\windows\x64\runner\Release\{#MyAppExeName}"; DestDir: "{app}"; Flags: ignoreversion
          Source: "build\windows\x64\runner\Release\*.dll"; DestDir: "{app}"; Flags: ignoreversion
          Source: "build\windows\x64\runner\Release\data\*"; DestDir: "{app}\data"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon
          "@ | Out-File -FilePath "setup.iss" -Encoding utf8

          curl.exe -fL -o D:\ChineseSimplified.isl https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl

      - name: Build installer
        run: |
          New-Item -ItemType Directory -Path "release" -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss
          Move-Item -Path "Output\${{ steps.resolve-version.outputs.app_executable }}-windows-x64-setup.exe" -Destination "release\${{ steps.resolve-version.outputs.app_executable }}-windows-x64-setup-${{ steps.resolve-version.outputs.asset_version }}.exe" -Force

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.resolve-version.outputs.app_executable }}-windows-x64-${{ steps.resolve-version.outputs.asset_version }}.zip
          path: release/${{ steps.resolve-version.outputs.app_executable }}-windows-x64-${{ steps.resolve-version.outputs.asset_version }}.zip
          archive: false
          if-no-files-found: error
          retention-days: ${{ fromJSON(steps.resolve-version.outputs.artifact_retention_days) }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.resolve-version.outputs.app_executable }}-windows-x64-setup-${{ steps.resolve-version.outputs.asset_version }}.exe
          path: release/${{ steps.resolve-version.outputs.app_executable }}-windows-x64-setup-${{ steps.resolve-version.outputs.asset_version }}.exe
          archive: false
          if-no-files-found: error
          retention-days: ${{ fromJSON(steps.resolve-version.outputs.artifact_retention_days) }}

  android:
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci') &&
      (github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Resolve build version
        id: resolve-version
        run: |
          python3 scripts/version.py sync --check
          python3 scripts/version.py resolve
          python3 scripts/version.py resolve --format output >> "$GITHUB_OUTPUT"

      - name: Setup pinned toolchains
        uses: ./.github/actions/setup-toolchains
        with:
          setup-android: 'true'

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> target"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libc6-dev
          sudo apt-get install -y libc6-dev-armhf-cross gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          sudo apt-get install -y clang llvm libclang-dev
          sudo apt-get install -y libc-dev
          sudo apt-get install -y libc6-dev-i386 gcc-multilib g++-multilib
          sudo apt-get install -y protobuf-compiler

      - name: Get dependencies
        run: flutter pub get

      - name: Build snapshot APK
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        env:
          BUILD_CHANNEL: ${{ steps.resolve-version.outputs.build_channel }}
        run: |
          flutter build apk --debug \
            --target-platform android-arm64,android-arm \
            --build-name "${{ steps.resolve-version.outputs.flutter_build_name }}" \
            --build-number "${{ steps.resolve-version.outputs.flutter_build_number }}" \
            --dart-define "BUILD_CHANNEL=${{ steps.resolve-version.outputs.build_channel }}" \
            --dart-define "BUILD_COMMIT=${{ steps.resolve-version.outputs.build_commit }}" \
            --dart-define "BUILD_RUN_NUMBER=${{ steps.resolve-version.outputs.build_run_number }}" \
            --dart-define "UPDATE_API_BASE_URL=$UPDATE_API_BASE_URL"
          mv build/app/outputs/flutter-apk/app-debug.apk \
            "build/app/outputs/flutter-apk/${{ steps.resolve-version.outputs.app_executable }}-android-debug-${{ steps.resolve-version.outputs.asset_version }}.apk"

      - name: Upload snapshot APK
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' &&
           contains(github.event.pull_request.labels.*.name, 'full-ci'))
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.resolve-version.outputs.app_executable }}-android-debug-${{ steps.resolve-version.outputs.asset_version }}.apk
          path: build/app/outputs/flutter-apk/${{ steps.resolve-version.outputs.app_executable }}-android-debug-${{ steps.resolve-version.outputs.asset_version }}.apk
          archive: false
          if-no-files-found: error
          retention-days: ${{ fromJSON(steps.resolve-version.outputs.artifact_retention_days) }}

      - name: Setup Android release signing
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/key.properties

      - name: Build signed release APKs
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          BUILD_CHANNEL: ${{ steps.resolve-version.outputs.build_channel }}
        run: |
          flutter build apk --release \
            --target-platform android-arm64,android-arm \
            --split-per-abi \
            --build-name "${{ steps.resolve-version.outputs.flutter_build_name }}" \
            --build-number "${{ steps.resolve-version.outputs.flutter_build_number }}" \
            --dart-define "BUILD_CHANNEL=${{ steps.resolve-version.outputs.build_channel }}" \
            --dart-define "BUILD_COMMIT=${{ steps.resolve-version.outputs.build_commit }}" \
            --dart-define "BUILD_RUN_NUMBER=${{ steps.resolve-version.outputs.build_run_number }}" \
            --dart-define "UPDATE_API_BASE_URL=$UPDATE_API_BASE_URL"
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "build/app/outputs/flutter-apk/${{ steps.resolve-version.outputs.app_executable }}-android-arm64-${{ steps.resolve-version.outputs.asset_version }}.apk"
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "build/app/outputs/flutter-apk/${{ steps.resolve-version.outputs.app_executable }}-android-armv7-${{ steps.resolve-version.outputs.asset_version }}.apk"

          flutter build apk --release \
            --target-platform android-arm64,android-arm \
            --build-name "${{ steps.resolve-version.outputs.flutter_build_name }}" \
            --build-number "${{ steps.resolve-version.outputs.flutter_build_number }}" \
            --dart-define "BUILD_CHANNEL=${{ steps.resolve-version.outputs.build_channel }}" \
            --dart-define "BUILD_COMMIT=${{ steps.resolve-version.outputs.build_commit }}" \
            --dart-define "BUILD_RUN_NUMBER=${{ steps.resolve-version.outputs.build_run_number }}" \
            --dart-define "UPDATE_API_BASE_URL=$UPDATE_API_BASE_URL"
          mv build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/${{ steps.resolve-version.outputs.app_executable }}-android-universal-${{ steps.resolve-version.outputs.asset_version }}.apk"

      - name: Upload arm64 release APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.resolve-version.outputs.app_executable }}-android-arm64-${{ steps.resolve-version.outputs.asset_version }}.apk
          path: build/app/outputs/flutter-apk/${{ steps.resolve-version.outputs.app_executable }}-android-arm64-${{ steps.resolve-version.outputs.asset_version }}.apk
          archive: false
          if-no-files-found: error
          retention-days: ${{ fromJSON(steps.resolve-version.outputs.artifact_retention_days) }}

      - name: Upload armv7 release APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.resolve-version.outputs.app_executable }}-android-armv7-${{ steps.resolve-version.outputs.asset_version }}.apk
          path: build/app/outputs/flutter-apk/${{ steps.resolve-version.outputs.app_executable }}-android-armv7-${{ steps.resolve-version.outputs.asset_version }}.apk
          archive: false
          if-no-files-found: error
          retention-days: ${{ fromJSON(steps.resolve-version.outputs.artifact_retention_days) }}

      - name: Upload universal release APK
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.resolve-version.outputs.app_executable }}-android-universal-${{ steps.resolve-version.outputs.asset_version }}.apk
          path: build/app/outputs/flutter-apk/${{ steps.resolve-version.outputs.app_executable }}-android-universal-${{ steps.resolve-version.outputs.asset_version }}.apk
          archive: false
          if-no-files-found: error
          retention-days: ${{ fromJSON(steps.resolve-version.outputs.artifact_retention_days) }}

  create-release:
    needs: [linux, windows, android]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve production version
        id: resolve-version
        run: |
          python3 scripts/version.py sync --check
          python3 scripts/version.py resolve --channel production
          python3 scripts/version.py resolve --channel production --format output >> "$GITHUB_OUTPUT"

      - name: Extract changelog for version
        id: extract-changelog
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "ERROR: CHANGELOG.md not found"
            exit 1
          fi
          CHANGELOG=$(awk -v ver="v${{ steps.resolve-version.outputs.version_base }}" '
            /^## / { in_section = 0 }
            $0 ~ "^## " ver { in_section = 1; next }
            in_section { print }
          ' CHANGELOG.md | sed '/^$/d')
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate changelog entry is present
        env:
          CHANGELOG: ${{ steps.extract-changelog.outputs.changelog }}
        run: |
          if [ -z "$CHANGELOG" ]; then
            echo "ERROR: No changelog entry found for $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -laR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.resolve-version.outputs.semantic_version }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.extract-changelog.outputs.changelog }}
          draft: false
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
