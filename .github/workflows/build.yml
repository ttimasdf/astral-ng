name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Optional repository/environment override for the compiled update API base URL.
  UPDATE_API_BASE_URL: ${{ vars.UPDATE_API_BASE_URL || 'https://update.astral-ng.rabit.pw/api/v1' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Run tests
        uses: ./.github/actions/test

  preview-update-api:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.author_association == 'OWNER' ||
       github.event.pull_request.author_association == 'MEMBER' ||
       github.event.pull_request.author_association == 'COLLABORATOR') &&
      (contains(github.event.pull_request.labels.*.name, 'platform-all') ||
       contains(github.event.pull_request.labels.*.name, 'platform-linux') ||
       contains(github.event.pull_request.labels.*.name, 'platform-windows') ||
       contains(github.event.pull_request.labels.*.name, 'platform-android'))
    runs-on: ubuntu-latest
    environment:
      name: Preview
      url: ${{ steps.deploy.outputs.deployment-url }}
    outputs:
      base-url: ${{ steps.deploy.outputs.base-url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Deploy PR update API
        id: deploy
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?Set VERCEL_TOKEN in the preview environment}"
          : "${VERCEL_ORG_ID:?Set VERCEL_ORG_ID in the preview environment}"
          : "${VERCEL_PROJECT_ID:?Set VERCEL_PROJECT_ID in the preview environment}"
          bunx vercel@59.1.3 pull \
            --yes \
            --environment=preview \
            --token "$VERCEL_TOKEN" \
            --cwd update-server
          bunx vercel@59.1.3 build \
            --token "$VERCEL_TOKEN" \
            --cwd update-server
          deployment_url="$(bunx vercel@59.1.3 deploy \
            --prebuilt \
            --token "$VERCEL_TOKEN" \
            --cwd update-server)"
          case "$deployment_url" in
            https://*.vercel.app) ;;
            *)
              echo "ERROR: Unexpected Vercel deployment URL: $deployment_url"
              exit 1
              ;;
          esac

          base_url="${deployment_url%/}/api/v1"
          response="$RUNNER_TEMP/update-api-preview.json"
          status="$(curl --silent --show-error \
            --output "$response" \
            --write-out '%{http_code}' \
            "$base_url/versions?channel=stable&limit=1")"
          if [ "$status" != 200 ]; then
            echo "ERROR: Preview API returned HTTP $status"
            exit 1
          fi
          jq -e '.schemaVersion == 1 and (.data | type == "array")' "$response" >/dev/null

          echo "deployment-url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "base-url=$base_url" >> "$GITHUB_OUTPUT"

  linux:
    needs: preview-update-api
    if: >-
      always() &&
      (needs.preview-update-api.result == 'success' ||
       needs.preview-update-api.result == 'skipped') &&
      (github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'platform-all') ||
       contains(github.event.pull_request.labels.*.name, 'platform-linux'))
    runs-on: ubuntu-latest
    env:
      UPDATE_API_BASE_URL: >-
        ${{ needs.preview-update-api.outputs.base-url ||
            vars.UPDATE_API_BASE_URL ||
            'https://update.astral-ng.rabit.pw/api/v1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Build Linux
        uses: ./.github/actions/build-linux
        with:
          package: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                (github.event_name == 'pull_request' &&
                 (contains(github.event.pull_request.labels.*.name, 'platform-all') ||
                  contains(github.event.pull_request.labels.*.name, 'platform-linux'))) }}

  windows:
    needs: preview-update-api
    if: >-
      always() &&
      (needs.preview-update-api.result == 'success' ||
       needs.preview-update-api.result == 'skipped') &&
      (github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'platform-all') ||
       contains(github.event.pull_request.labels.*.name, 'platform-windows'))
    runs-on: windows-2022
    env:
      UPDATE_API_BASE_URL: >-
        ${{ needs.preview-update-api.outputs.base-url ||
            vars.UPDATE_API_BASE_URL ||
            'https://update.astral-ng.rabit.pw/api/v1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Build Windows
        uses: ./.github/actions/build-windows
        with:
          upload-artifacts: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                (github.event_name == 'pull_request' &&
                 (contains(github.event.pull_request.labels.*.name, 'platform-all') ||
                  contains(github.event.pull_request.labels.*.name, 'platform-windows'))) }}

  android:
    needs: preview-update-api
    if: >-
      always() &&
      (needs.preview-update-api.result == 'success' ||
       needs.preview-update-api.result == 'skipped') &&
      (github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'platform-all') ||
       contains(github.event.pull_request.labels.*.name, 'platform-android'))
    runs-on: ubuntu-24.04
    env:
      UPDATE_API_BASE_URL: >-
        ${{ needs.preview-update-api.outputs.base-url ||
            vars.UPDATE_API_BASE_URL ||
            'https://update.astral-ng.rabit.pw/api/v1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Build Android snapshot
        uses: ./.github/actions/build-android
        with:
          build-mode: debug
          apk-layout: unified
          upload-snapshot: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                (github.event_name == 'pull_request' &&
                 (contains(github.event.pull_request.labels.*.name, 'platform-all') ||
                  contains(github.event.pull_request.labels.*.name, 'platform-android'))) }}
