name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Optional repository/environment override for the compiled update API base URL.
  UPDATE_API_BASE_URL: ${{ vars.UPDATE_API_BASE_URL || 'https://update.astral-ng.rabit.pw/api/v1' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Run tests
        uses: ./.github/actions/test

  linux:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'platform-all') ||
      contains(github.event.pull_request.labels.*.name, 'platform-linux')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Build Linux
        uses: ./.github/actions/build-linux
        with:
          package: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                (github.event_name == 'pull_request' &&
                 (contains(github.event.pull_request.labels.*.name, 'platform-all') ||
                  contains(github.event.pull_request.labels.*.name, 'platform-linux'))) }}

  windows:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'platform-all') ||
      contains(github.event.pull_request.labels.*.name, 'platform-windows')
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Build Windows
        uses: ./.github/actions/build-windows
        with:
          upload-artifacts: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                (github.event_name == 'pull_request' &&
                 (contains(github.event.pull_request.labels.*.name, 'platform-all') ||
                  contains(github.event.pull_request.labels.*.name, 'platform-windows'))) }}

  android:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'platform-all') ||
      contains(github.event.pull_request.labels.*.name, 'platform-android')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Build Android snapshot
        uses: ./.github/actions/build-android
        with:
          build-mode: debug
          apk-layout: unified
          upload-snapshot: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                (github.event_name == 'pull_request' &&
                 (contains(github.event.pull_request.labels.*.name, 'platform-all') ||
                  contains(github.event.pull_request.labels.*.name, 'platform-android'))) }}
