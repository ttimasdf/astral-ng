name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  # Optional repository/environment override for the compiled update API base URL.
  UPDATE_API_BASE_URL: ${{ vars.UPDATE_API_BASE_URL || 'https://enmesh.rabit.pw/api/v1' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Run tests
        uses: ./.github/actions/test

  changes:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      update_server: ${{ steps.filter.outputs.update_server }}
      linux: ${{ steps.filter.outputs.linux }}
      windows: ${{ steps.filter.outputs.windows }}
      android: ${{ steps.filter.outputs.android }}
      all: ${{ steps.filter.outputs.all }}
    steps:
      - name: Checkout push history
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            update_server:
              - 'update-server/**'
              - '.github/workflows/deploy-update-api.yml'
            linux:
              - 'linux/**'
              - '.github/actions/build-linux/**'
              - 'scripts/package_appimage.sh'
            windows:
              - 'windows/**'
              - '.github/actions/build-windows/**'
              - 'dlls/**'
              - 'installer/**'
            android:
              - 'android/**'
              - '.github/actions/build-android/**'
            all:
              - 'lib/**'
              - 'assets/**'
              - 'fonts/**'
              - 'rust/**'
              - 'rust_builder/**'
              - 'vpn_service_plugin/**'
              - 'web/**'
              - '.github/actions/test/**'
              - '.github/actions/setup-toolchains/**'
              - '.github/actions/resolve-version/**'
              - 'scripts/version.py'
              - 'scripts/sync_toolchains.py'
              - 'scripts/generate_icons.py'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - 'flake.nix'
              - 'flake.lock'
              - 'toolchains.env'
              - 'VERSION'
              - 'BUILD_NUMBER'

  preview-update-api:
    needs: changes
    if: >-
      needs.changes.result == 'success' &&
      needs.changes.outputs.update_server == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.author_association == 'OWNER' ||
       github.event.pull_request.author_association == 'MEMBER' ||
       github.event.pull_request.author_association == 'COLLABORATOR') &&
      (contains(github.event.pull_request.labels.*.name, 'platform-all') ||
       contains(github.event.pull_request.labels.*.name, 'platform-linux') ||
       contains(github.event.pull_request.labels.*.name, 'platform-windows') ||
       contains(github.event.pull_request.labels.*.name, 'platform-android'))
    uses: ./.github/workflows/deploy-update-api.yml
    with:
      github_environment: Preview
      checkout_ref: ${{ github.event.pull_request.head.sha }}

  linux:
    needs: [changes, preview-update-api]
    if: >-
      !cancelled() &&
      (needs.preview-update-api.result == 'success' ||
       needs.preview-update-api.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.changes.result == 'success' &&
        (needs.changes.outputs.all == 'true' ||
         needs.changes.outputs.linux == 'true' ||
         contains(github.event.pull_request.labels.*.name, 'platform-all') ||
         contains(github.event.pull_request.labels.*.name, 'platform-linux'))))
    runs-on: ubuntu-latest
    env:
      UPDATE_API_BASE_URL: >-
        ${{ needs.preview-update-api.outputs.base-url ||
            vars.UPDATE_API_BASE_URL ||
            'https://enmesh.rabit.pw/api/v1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Build Linux
        uses: ./.github/actions/build-linux
        with:
          package: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                (github.event_name == 'pull_request' &&
                 (needs.changes.outputs.all == 'true' ||
                  needs.changes.outputs.linux == 'true' ||
                  contains(github.event.pull_request.labels.*.name, 'platform-all') ||
                  contains(github.event.pull_request.labels.*.name, 'platform-linux'))) }}

  windows:
    needs: [changes, preview-update-api]
    if: >-
      !cancelled() &&
      (needs.preview-update-api.result == 'success' ||
       needs.preview-update-api.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.changes.result == 'success' &&
        (needs.changes.outputs.all == 'true' ||
         needs.changes.outputs.windows == 'true' ||
         contains(github.event.pull_request.labels.*.name, 'platform-all') ||
         contains(github.event.pull_request.labels.*.name, 'platform-windows'))))
    runs-on: windows-2022
    env:
      UPDATE_API_BASE_URL: >-
        ${{ needs.preview-update-api.outputs.base-url ||
            vars.UPDATE_API_BASE_URL ||
            'https://enmesh.rabit.pw/api/v1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Build Windows
        uses: ./.github/actions/build-windows
        with:
          upload-artifacts: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                (github.event_name == 'pull_request' &&
                 (needs.changes.outputs.all == 'true' ||
                  needs.changes.outputs.windows == 'true' ||
                  contains(github.event.pull_request.labels.*.name, 'platform-all') ||
                  contains(github.event.pull_request.labels.*.name, 'platform-windows'))) }}

  android:
    needs: [changes, preview-update-api]
    if: >-
      !cancelled() &&
      (needs.preview-update-api.result == 'success' ||
       needs.preview-update-api.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.changes.result == 'success' &&
        (needs.changes.outputs.all == 'true' ||
         needs.changes.outputs.android == 'true' ||
         contains(github.event.pull_request.labels.*.name, 'platform-all') ||
         contains(github.event.pull_request.labels.*.name, 'platform-android'))))
    runs-on: ubuntu-24.04
    env:
      UPDATE_API_BASE_URL: >-
        ${{ needs.preview-update-api.outputs.base-url ||
            vars.UPDATE_API_BASE_URL ||
            'https://enmesh.rabit.pw/api/v1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Build Android snapshot
        uses: ./.github/actions/build-android
        with:
          build-mode: debug
          apk-layout: unified
          upload-snapshot: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                (github.event_name == 'pull_request' &&
                 (needs.changes.outputs.all == 'true' ||
                  needs.changes.outputs.android == 'true' ||
                  contains(github.event.pull_request.labels.*.name, 'platform-all') ||
                  contains(github.event.pull_request.labels.*.name, 'platform-android'))) }}
