name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  # Optional repository/environment override for the compiled update API base URL.
  UPDATE_API_BASE_URL: ${{ vars.UPDATE_API_BASE_URL || 'https://astral-ng.rabit.pw/api/v1' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Run tests
        uses: ./.github/actions/test

  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      update_server: ${{ steps.filter.outputs.update_server }}
      linux: ${{ steps.filter.outputs.linux }}
      windows: ${{ steps.filter.outputs.windows }}
      android: ${{ steps.filter.outputs.android }}
      all: ${{ steps.filter.outputs.all }}
    steps:
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            update_server:
              - 'update-server/**'
            linux:
              - 'linux/**'
              - '.github/actions/build-linux/**'
              - 'scripts/package_appimage.sh'
            windows:
              - 'windows/**'
              - '.github/actions/build-windows/**'
              - 'dlls/**'
              - 'installer/**'
            android:
              - 'android/**'
              - '.github/actions/build-android/**'
            all:
              - 'lib/**'
              - 'assets/**'
              - 'fonts/**'
              - 'rust/**'
              - 'rust_builder/**'
              - 'vpn_service_plugin/**'
              - 'web/**'
              - '.github/actions/test/**'
              - '.github/actions/setup-toolchains/**'
              - '.github/workflows/**'
              - 'scripts/version.py'
              - 'scripts/sync_toolchains.py'
              - 'scripts/generate_icons.py'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - 'flake.nix'
              - 'flake.lock'
              - 'toolchains.env'
              - 'VERSION'
              - 'BUILD_NUMBER'

  preview-update-api:
    needs: changes
    if: >-
      needs.changes.result == 'success' &&
      needs.changes.outputs.update_server == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.author_association == 'OWNER' ||
       github.event.pull_request.author_association == 'MEMBER' ||
       github.event.pull_request.author_association == 'COLLABORATOR') &&
      (contains(github.event.pull_request.labels.*.name, 'platform-all') ||
       contains(github.event.pull_request.labels.*.name, 'platform-linux') ||
       contains(github.event.pull_request.labels.*.name, 'platform-windows') ||
       contains(github.event.pull_request.labels.*.name, 'platform-android'))
    runs-on: ubuntu-latest
    environment:
      name: Preview
      url: ${{ steps.deploy.outputs.deployment-url }}
    outputs:
      base-url: ${{ steps.deploy.outputs.base-url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Deploy PR update API
        id: deploy
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?Set VERCEL_TOKEN in the Preview environment}"
          : "${VERCEL_ORG_ID:?Set VERCEL_ORG_ID in the Preview environment}"
          : "${VERCEL_PROJECT_ID:?Set VERCEL_PROJECT_ID in the Preview environment}"

          umask 077
          mkdir -p .vercel
          project_response="$RUNNER_TEMP/vercel-project.json"
          environment_response="$RUNNER_TEMP/vercel-preview-environment.json"
          deployment_response="$RUNNER_TEMP/vercel-preview-deployment.json"

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --output "$project_response" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID"
          jq -e \
            --arg project_id "$VERCEL_PROJECT_ID" \
            --arg org_id "$VERCEL_ORG_ID" \
            '.id == $project_id and .accountId == $org_id and
             (.rootDirectory == "update-server" or .rootDirectory == "update-server/")' \
            "$project_response" >/dev/null
          jq '{
                projectId: .id,
                orgId: .accountId,
                projectName: .name,
                settings: {
                  createdAt: .createdAt,
                  framework: null,
                  devCommand: .devCommand,
                  installCommand: .installCommand,
                  buildCommand: .buildCommand,
                  outputDirectory: .outputDirectory,
                  rootDirectory: .rootDirectory,
                  directoryListing: .directoryListing,
                  nodeVersion: .nodeVersion
                }
              }' "$project_response" > .vercel/project.json

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --output "$environment_response" \
            "https://api.vercel.com/v3/env/pull/$VERCEL_PROJECT_ID/preview?source=github-actions&teamId=$VERCEL_ORG_ID"
          jq -e \
            '(.env | type == "object") and
             (.buildEnv | type == "object") and
             ((.env + .buildEnv) | to_entries |
              all(.key | test("^[A-Za-z_][A-Za-z0-9_]*$")))' \
            "$environment_response" >/dev/null
          jq -r \
            '(.env + .buildEnv) | to_entries[] |
             "\(.key)=\(.value | @json)"' \
            "$environment_response" > .vercel/.env.preview.local

          bunx vercel@59.1.3 build \
            --token "$VERCEL_TOKEN"
          bunx vercel@59.1.3 deploy \
            --prebuilt \
            --json \
            --token "$VERCEL_TOKEN" \
            > "$deployment_response"
          deployment_url="$(jq -er \
            '(.deployment.url? // .url?) |
             select(type == "string") |
             select(test("^https://[A-Za-z0-9-]+\\.vercel\\.app$"))' \
            "$deployment_response")"

          base_url="${deployment_url%/}/api/v1"
          response="$RUNNER_TEMP/update-api-preview.json"
          status="$(curl --silent --show-error \
            --output "$response" \
            --write-out '%{http_code}' \
            "$base_url/versions?channel=stable&limit=1")"
          if [ "$status" != 200 ]; then
            echo "ERROR: Preview API returned HTTP $status"
            exit 1
          fi
          jq -e '.schemaVersion == 1 and (.data | type == "array")' "$response" >/dev/null

          echo "deployment-url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "base-url=$base_url" >> "$GITHUB_OUTPUT"

      - name: Remove Vercel build state
        if: always()
        run: |
          rm -rf -- .vercel
          rm -f -- \
            "$RUNNER_TEMP/vercel-project.json" \
            "$RUNNER_TEMP/vercel-preview-environment.json" \
            "$RUNNER_TEMP/vercel-preview-deployment.json" \
            "$RUNNER_TEMP/update-api-preview.json"

  linux:
    needs: [changes, preview-update-api]
    if: >-
      always() &&
      (needs.preview-update-api.result == 'success' ||
       needs.preview-update-api.result == 'skipped') &&
      (github.event_name != 'pull_request' ||
       needs.changes.outputs.all == 'true' ||
       needs.changes.outputs.linux == 'true' ||
       contains(github.event.pull_request.labels.*.name, 'platform-all') ||
       contains(github.event.pull_request.labels.*.name, 'platform-linux'))
    runs-on: ubuntu-latest
    env:
      UPDATE_API_BASE_URL: >-
        ${{ needs.preview-update-api.outputs.base-url ||
            vars.UPDATE_API_BASE_URL ||
            'https://astral-ng.rabit.pw/api/v1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Build Linux
        uses: ./.github/actions/build-linux
        with:
          package: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                (github.event_name == 'pull_request' &&
                 (needs.changes.outputs.all == 'true' ||
                  needs.changes.outputs.linux == 'true' ||
                  contains(github.event.pull_request.labels.*.name, 'platform-all') ||
                  contains(github.event.pull_request.labels.*.name, 'platform-linux'))) }}

  windows:
    needs: [changes, preview-update-api]
    if: >-
      always() &&
      (needs.preview-update-api.result == 'success' ||
       needs.preview-update-api.result == 'skipped') &&
      (github.event_name != 'pull_request' ||
       needs.changes.outputs.all == 'true' ||
       needs.changes.outputs.windows == 'true' ||
       contains(github.event.pull_request.labels.*.name, 'platform-all') ||
       contains(github.event.pull_request.labels.*.name, 'platform-windows'))
    runs-on: windows-2022
    env:
      UPDATE_API_BASE_URL: >-
        ${{ needs.preview-update-api.outputs.base-url ||
            vars.UPDATE_API_BASE_URL ||
            'https://astral-ng.rabit.pw/api/v1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Build Windows
        uses: ./.github/actions/build-windows
        with:
          upload-artifacts: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                (github.event_name == 'pull_request' &&
                 (needs.changes.outputs.all == 'true' ||
                  needs.changes.outputs.windows == 'true' ||
                  contains(github.event.pull_request.labels.*.name, 'platform-all') ||
                  contains(github.event.pull_request.labels.*.name, 'platform-windows'))) }}

  android:
    needs: [changes, preview-update-api]
    if: >-
      always() &&
      (needs.preview-update-api.result == 'success' ||
       needs.preview-update-api.result == 'skipped') &&
      (github.event_name != 'pull_request' ||
       needs.changes.outputs.all == 'true' ||
       needs.changes.outputs.android == 'true' ||
       contains(github.event.pull_request.labels.*.name, 'platform-all') ||
       contains(github.event.pull_request.labels.*.name, 'platform-android'))
    runs-on: ubuntu-24.04
    env:
      UPDATE_API_BASE_URL: >-
        ${{ needs.preview-update-api.outputs.base-url ||
            vars.UPDATE_API_BASE_URL ||
            'https://astral-ng.rabit.pw/api/v1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Build Android snapshot
        uses: ./.github/actions/build-android
        with:
          build-mode: debug
          apk-layout: unified
          upload-snapshot: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                (github.event_name == 'pull_request' &&
                 (needs.changes.outputs.all == 'true' ||
                  needs.changes.outputs.android == 'true' ||
                  contains(github.event.pull_request.labels.*.name, 'platform-all') ||
                  contains(github.event.pull_request.labels.*.name, 'platform-android'))) }}
