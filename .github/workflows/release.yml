name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Optional repository/environment override for the compiled update API base URL.
  UPDATE_API_BASE_URL: ${{ vars.UPDATE_API_BASE_URL || 'https://update.astral-ng.rabit.pw/api/v1' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Build Linux release
        uses: ./.github/actions/build-linux
        with:
          package: 'true'

  windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Build Windows release
        uses: ./.github/actions/build-windows

  android:
    environment: production
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Build signed Android release
        uses: ./.github/actions/build-android
        with:
          signed: 'true'
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          store-password: ${{ secrets.STORE_PASSWORD }}
          key-password: ${{ secrets.KEY_PASSWORD }}

  create-release:
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve production version
        id: resolve-version
        run: |
          python3 scripts/version.py sync --check
          python3 scripts/version.py resolve --channel production
          python3 scripts/version.py resolve --channel production --format output >> "$GITHUB_OUTPUT"

      - name: Extract changelog for version
        id: extract-changelog
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "ERROR: CHANGELOG.md not found"
            exit 1
          fi
          CHANGELOG=$(awk -v ver="v${{ steps.resolve-version.outputs.version_base }}" '
            /^## / { in_section = 0 }
            $0 ~ "^## \\[?" ver "\\]?" { in_section = 1; next }
            in_section { lines[++count] = $0 }
            END {
              first = 1
              while (first <= count && lines[first] == "") first++
              while (count >= first && lines[count] == "") count--
              for (i = first; i <= count; i++) print lines[i]
            }
          ' CHANGELOG.md)
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate changelog entry is present
        env:
          CHANGELOG: ${{ steps.extract-changelog.outputs.changelog }}
        run: |
          if [ -z "$CHANGELOG" ]; then
            echo "ERROR: No changelog entry found for $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Assemble release assets
        env:
          APP_EXECUTABLE: ${{ steps.resolve-version.outputs.app_executable }}
          ASSET_VERSION: ${{ steps.resolve-version.outputs.asset_version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets

          copy_asset() {
            local name="$1"
            local source
            source="$(find artifacts -type f -name "$name" -print -quit)"
            if [ -z "$source" ]; then
              echo "ERROR: release artifact not found: $name"
              exit 1
            fi
            cp "$source" "release-assets/$name"
          }

          copy_asset "$APP_EXECUTABLE-linux-x64-$ASSET_VERSION.tar.gz"
          copy_asset "$APP_EXECUTABLE-linux-x64-$ASSET_VERSION.deb"
          copy_asset "$APP_EXECUTABLE-linux-x64-$ASSET_VERSION.rpm"
          copy_asset "$APP_EXECUTABLE-windows-x64-setup-$ASSET_VERSION.exe"
          copy_asset "$APP_EXECUTABLE-android-arm64-$ASSET_VERSION.apk"
          copy_asset "$APP_EXECUTABLE-android-armv7-$ASSET_VERSION.apk"
          copy_asset "$APP_EXECUTABLE-android-universal-$ASSET_VERSION.apk"

          windows_artifact="artifacts/$APP_EXECUTABLE-windows-x64-$ASSET_VERSION.zip"
          windows_zip="release-assets/$APP_EXECUTABLE-windows-x64-$ASSET_VERSION.zip"
          if [ -d "$windows_artifact" ]; then
            python3 - "$windows_artifact" "$windows_zip" <<'PY'
          import sys
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          with ZipFile(target, "w", ZIP_DEFLATED) as archive:
              for path in sorted(source.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(source))
          PY
          elif [ -f "$windows_artifact" ]; then
            cp "$windows_artifact" "$windows_zip"
          else
            echo "ERROR: Windows ZIP artifact not found: $windows_artifact"
            exit 1
          fi

          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.resolve-version.outputs.semantic_version }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.extract-changelog.outputs.changelog }}
          draft: false
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
