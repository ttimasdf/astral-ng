name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Optional repository/environment override for the compiled update API base URL.
  UPDATE_API_BASE_URL: ${{ vars.UPDATE_API_BASE_URL || 'https://astral-ng.rabit.pw/api/v1' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Run tests
        uses: ./.github/actions/test

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Build Linux release
        uses: ./.github/actions/build-linux
        with:
          package: 'true'

  windows:
    needs: test
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Build Windows release
        uses: ./.github/actions/build-windows

  android:
    needs: test
    environment: Production Signing
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Setup Android release signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> android/key.properties
        shell: bash

      - name: Build signed Android release
        uses: ./.github/actions/build-android
        with:
          build-mode: release
          apk-layout: both

      - name: Remove Android signing files
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
        shell: bash

  create-release:
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve production version
        id: resolve-version
        uses: ./.github/actions/resolve-version
        with:
          channel: production

      - name: Extract changelog for version
        id: extract-changelog
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "ERROR: CHANGELOG.md not found"
            exit 1
          fi
          CHANGELOG=$(awk -v ver="v${{ steps.resolve-version.outputs.semantic_version }}" '
            /^## / { in_section = 0 }
            $0 == "## " ver || index($0, "## " ver " ") == 1 ||
              $0 == "## [" ver "]" || index($0, "## [" ver "] ") == 1 {
              in_section = 1
              next
            }
            in_section { lines[++count] = $0 }
            END {
              first = 1
              while (first <= count && lines[first] == "") first++
              while (count >= first && lines[count] == "") count--
              for (i = first; i <= count; i++) print lines[i]
            }
          ' CHANGELOG.md)
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate changelog entry is present
        env:
          CHANGELOG: ${{ steps.extract-changelog.outputs.changelog }}
        run: |
          if [ -z "$CHANGELOG" ]; then
            echo "ERROR: No changelog entry found for $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Assemble release assets
        env:
          APP_EXECUTABLE: ${{ steps.resolve-version.outputs.app_executable }}
          ASSET_VERSION: ${{ steps.resolve-version.outputs.asset_version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets

          copy_asset() {
            local name="$1"
            local source
            source="$(find artifacts -type f -name "$name" -print -quit)"
            if [ -z "$source" ]; then
              echo "ERROR: release artifact not found: $name"
              exit 1
            fi
            cp "$source" "release-assets/$name"
          }

          copy_asset "$APP_EXECUTABLE-linux-x64-$ASSET_VERSION.tar.gz"
          copy_asset "$APP_EXECUTABLE-linux-x64-$ASSET_VERSION.deb"
          copy_asset "$APP_EXECUTABLE-linux-x64-$ASSET_VERSION.rpm"
          copy_asset "$APP_EXECUTABLE-windows-x64-setup-$ASSET_VERSION.exe"
          copy_asset "$APP_EXECUTABLE-android-arm64-$ASSET_VERSION.apk"
          copy_asset "$APP_EXECUTABLE-android-armv7-$ASSET_VERSION.apk"
          copy_asset "$APP_EXECUTABLE-android-universal-$ASSET_VERSION.apk"

          windows_artifact="artifacts/$APP_EXECUTABLE-windows-x64-$ASSET_VERSION.zip"
          windows_zip="release-assets/$APP_EXECUTABLE-windows-x64-$ASSET_VERSION.zip"
          if [ -d "$windows_artifact" ]; then
            python3 - "$windows_artifact" "$windows_zip" <<'PY'
          import sys
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          with ZipFile(target, "w", ZIP_DEFLATED) as archive:
              for path in sorted(source.rglob("*")):
                  if path.is_file():
                      archive.write(path, path.relative_to(source))
          PY
          elif [ -f "$windows_artifact" ]; then
            cp "$windows_artifact" "$windows_zip"
          else
            echo "ERROR: Windows ZIP artifact not found: $windows_artifact"
            exit 1
          fi

          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.resolve-version.outputs.semantic_version }}
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.extract-changelog.outputs.changelog }}
          draft: false
          prerelease: ${{ steps.resolve-version.outputs.is_prerelease }}
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-update-api:
    needs: create-release
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://astral-ng.rabit.pw/
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Deploy production update API
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?Set VERCEL_TOKEN in the Production environment}"
          : "${VERCEL_ORG_ID:?Set VERCEL_ORG_ID in the Production environment}"
          : "${VERCEL_PROJECT_ID:?Set VERCEL_PROJECT_ID in the Production environment}"

          umask 077
          mkdir -p .vercel
          project_response="$RUNNER_TEMP/vercel-project.json"
          environment_response="$RUNNER_TEMP/vercel-production-environment.json"
          deployment_response="$RUNNER_TEMP/vercel-production-deployment.json"

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --output "$project_response" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID"
          jq -e \
            --arg project_id "$VERCEL_PROJECT_ID" \
            --arg org_id "$VERCEL_ORG_ID" \
            '.id == $project_id and .accountId == $org_id and
             (.rootDirectory == "update-server" or .rootDirectory == "update-server/")' \
            "$project_response" >/dev/null
          jq '{
                projectId: .id,
                orgId: .accountId,
                projectName: .name,
                settings: {
                  createdAt: .createdAt,
                  framework: null,
                  devCommand: .devCommand,
                  installCommand: .installCommand,
                  buildCommand: .buildCommand,
                  outputDirectory: .outputDirectory,
                  rootDirectory: .rootDirectory,
                  directoryListing: .directoryListing,
                  nodeVersion: .nodeVersion
                }
              }' "$project_response" > .vercel/project.json

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --output "$environment_response" \
            "https://api.vercel.com/v3/env/pull/$VERCEL_PROJECT_ID/production?source=github-actions&teamId=$VERCEL_ORG_ID"
          jq -e \
            '(.env | type == "object") and
             (.buildEnv | type == "object") and
             ((.env + .buildEnv) | to_entries |
              all(.key | test("^[A-Za-z_][A-Za-z0-9_]*$")))' \
            "$environment_response" >/dev/null
          jq -r \
            '(.env + .buildEnv) | to_entries[] |
             "\(.key)=\(.value | @json)"' \
            "$environment_response" > .vercel/.env.production.local

          bunx vercel@59.1.3 build \
            --prod \
            --token "$VERCEL_TOKEN"
          bunx vercel@59.1.3 deploy \
            --prebuilt \
            --prod \
            --json \
            --token "$VERCEL_TOKEN" \
            > "$deployment_response"
          deployment_url="$(jq -er \
            '(.deployment.url? // .url?) |
             select(type == "string") |
             select(test("^https://[A-Za-z0-9-]+\\.vercel\\.app$"))' \
            "$deployment_response")"

          response="$RUNNER_TEMP/update-api-production.json"
          status="$(curl --silent --show-error \
            --output "$response" \
            --write-out '%{http_code}' \
            "$deployment_url/api/v1/versions?channel=stable&limit=1")"
          if [ "$status" != 200 ]; then
            echo "ERROR: Production deployment returned HTTP $status"
            exit 1
          fi
          jq -e '.schemaVersion == 1 and (.data | type == "array")' "$response" >/dev/null

          status="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            'https://astral-ng.rabit.pw/api/v1/versions?channel=stable&limit=1')"
          if [ "$status" != 200 ]; then
            echo "ERROR: Production custom domain returned HTTP $status"
            exit 1
          fi

          echo "deployment-url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Remove Vercel build state
        if: always()
        shell: bash
        run: |
          rm -rf -- .vercel
          rm -f -- \
            "$RUNNER_TEMP/vercel-project.json" \
            "$RUNNER_TEMP/vercel-production-environment.json" \
            "$RUNNER_TEMP/vercel-production-deployment.json" \
            "$RUNNER_TEMP/update-api-production.json"
